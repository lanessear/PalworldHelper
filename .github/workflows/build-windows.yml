name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Oodle-capable save parser
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/deafdudecomputers/PalworldSaveTools.git parser-upstream
          python -m pip install --disable-pip-version-check pyinstaller==6.14.2
          python -m pip install ./parser-upstream/src/palsav/palooz
          python -m pip install ./parser-upstream/src/palsav

      - name: Build save parser helper
        run: python -m PyInstaller --noconfirm --clean --onefile --name PalworldSaveParser --collect-all palsav --collect-all palooz tools/save_parser/palworld_save_parser.py

      - name: Embed parser in PalworldHelper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/PalworldHelper/Embedded | Out-Null
          Copy-Item dist/PalworldSaveParser.exe src/PalworldHelper/Embedded/PalworldSaveParser.exe

      - name: Restore dependencies
        run: dotnet restore PalworldHelper.sln

      - name: Build solution
        run: dotnet build PalworldHelper.sln --configuration Release --no-restore

      - name: Publish single self-contained Windows executable
        run: dotnet publish src/PalworldHelper/PalworldHelper.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Verify single-file release
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File
          if ($files.Count -ne 1 -or $files[0].Name -ne 'PalworldHelper.exe') {
            Write-Host 'Unexpected release files:'
            $files | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

      - name: Upload Windows artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PalworldHelper-win-x64
          path: publish/PalworldHelper.exe
          if-no-files-found: error