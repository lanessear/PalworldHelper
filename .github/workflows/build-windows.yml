name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify default breeding JSON
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'palworld_breeding_results_v1.0_2026-07-24.json'
          if (-not (Test-Path $path)) {
            throw "Missing repository file: palworld_breeding_results_v1.0_2026-07-24.json"
          }

          $json = Get-Content $path -Raw | ConvertFrom-Json
          if ($json.pals.Count -ne 298) {
            throw "Default dataset contains $($json.pals.Count) Pal names instead of 298."
          }
          if ($json.results.Count -ne 44551) {
            throw "Default dataset contains $($json.results.Count) results instead of 44,551."
          }
          $selfBreedingRows = @($json.results | Where-Object { $_[0] -eq $_[1] }).Count
          if ($selfBreedingRows -ne 298) {
            throw "Default dataset contains $selfBreedingRows self-breeding rows instead of 298."
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Oodle-capable save parser
        shell: pwsh
        run: |
          $parserSource = 'https://github.com/deafdudecomputers/PalworldSaveTools.git'
          Remove-Item parser-upstream, dist, build -Recurse -Force -ErrorAction SilentlyContinue
          git clone --depth 1 $parserSource parser-upstream
          $parserCommit = git -C parser-upstream rev-parse HEAD
          "Parser source: $parserSource@$parserCommit" | Out-File -FilePath parser-source.txt -Encoding utf8
          Write-Host "Parser source: $parserSource@$parserCommit"
          python -m pip install --disable-pip-version-check pyinstaller==6.14.2
          python -m pip install ./parser-upstream/src/palsav/palooz
          python -m pip install ./parser-upstream/src/palsav

      - name: Build save parser
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name PalworldSaveParser --collect-all palsav --collect-all palooz --add-data="tools/save_parser/palworld_character_names.json:." --add-data="tools/save_parser/palworld_passive_skills.json:." tools/save_parser/palworld_save_parser.py

      - name: Restore dependencies
        run: dotnet restore PalworldHelper.sln

      - name: Build solution
        run: dotnet build PalworldHelper.sln --configuration Release --no-restore

      - name: Publish portable program folder
        shell: pwsh
        run: |
          Remove-Item publish, package -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish src/PalworldHelper/PalworldHelper.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish

          New-Item -ItemType Directory -Force publish/parser | Out-Null
          Copy-Item dist/PalworldSaveParser.exe publish/parser/PalworldSaveParser.exe

          $files = @(Get-ChildItem publish -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path publish).Path.Length + 1).Replace('\','/') })
          $files += 'palworldhelper.manifest.json'
          $files | ConvertTo-Json | Set-Content publish/palworldhelper.manifest.json -Encoding utf8

          New-Item -ItemType Directory package | Out-Null
          Compress-Archive -Path publish/* -DestinationPath package/PalworldHelper-win-x64.zip -CompressionLevel Optimal

      - name: Verify package
        shell: pwsh
        run: |
          foreach ($required in @('PalworldHelper.exe','parser/PalworldSaveParser.exe','palworld_breeding_results_v1.0_2026-07-24.json','palworld_passive_skills.json','THIRD-PARTY-NOTICES.md','palworldhelper.manifest.json')) {
            if (-not (Test-Path (Join-Path publish $required))) { throw "Missing required package file: $required" }
          }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalworldHelper-win-x64
          path: package/PalworldHelper-win-x64.zip
          if-no-files-found: error

      - name: Attach package to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: package/PalworldHelper-win-x64.zip
          generate_release_notes: true
