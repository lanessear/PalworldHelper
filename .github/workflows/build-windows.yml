name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify default breeding JSON
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'palworld_breeding_results.default.json'
          if (-not (Test-Path $path)) {
            throw "Missing repository file: palworld_breeding_results.default.json"
          }

          $json = Get-Content $path -Raw | ConvertFrom-Json
          if ($json.pals.Count -ne 298) {
            throw "Default dataset contains $($json.pals.Count) Pal names instead of 298."
          }
          if ($json.results.Count -ne 44253) {
            throw "Default dataset contains $($json.results.Count) results instead of 44,253."
          }
          if (@($json.results | Where-Object { $_[0] -eq $_[1] }).Count -ne 0) {
            throw "Default dataset still contains self-breeding rows."
          }

      - name: Restore dependencies
        run: dotnet restore PalworldHelper.sln

      - name: Build solution
        run: dotnet build PalworldHelper.sln --configuration Release --no-restore

      - name: Publish portable program folder
        shell: pwsh
        run: |
          Remove-Item publish, package -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish src/PalworldHelper/PalworldHelper.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish

          $files = @(Get-ChildItem publish -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path publish).Path.Length + 1).Replace('\','/') })
          $files += 'palworldhelper.manifest.json'
          $files | ConvertTo-Json | Set-Content publish/palworldhelper.manifest.json -Encoding utf8

          New-Item -ItemType Directory package | Out-Null
          Compress-Archive -Path publish/* -DestinationPath package/PalworldHelper-win-x64.zip -CompressionLevel Optimal

      - name: Verify package
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem publish -Recurse -File -Filter *.exe)
          if ($executables.Count -ne 1 -or $executables[0].Name -ne 'PalworldHelper.exe') {
            throw "Expected exactly one EXE named PalworldHelper.exe, found: $($executables.Name -join ', ')"
          }
          foreach ($required in @('PalworldHelper.exe','palworld_breeding_results.default.json','palworldhelper.manifest.json')) {
            if (-not (Test-Path (Join-Path publish $required))) { throw "Missing required package file: $required" }
          }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalworldHelper-win-x64
          path: package/PalworldHelper-win-x64.zip
          if-no-files-found: error

      - name: Attach package to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: package/PalworldHelper-win-x64.zip
          generate_release_notes: true
