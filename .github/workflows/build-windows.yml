name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install parser build dependencies
        run: python -m pip install --disable-pip-version-check palworld-save-tools==0.23.0 pyinstaller==6.14.2

      - name: Build save parser helper
        run: python -m PyInstaller --noconfirm --clean --onefile --name PalworldSaveParser --collect-all palworld_save_tools tools/save_parser/palworld_save_parser.py

      - name: Restore dependencies
        run: dotnet restore PalworldHelper.sln

      - name: Build solution
        run: dotnet build PalworldHelper.sln --configuration Release --no-restore

      - name: Publish self-contained Windows executable
        run: dotnet publish src/PalworldHelper/PalworldHelper.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Add parser to release
        run: Copy-Item dist/PalworldSaveParser.exe publish/PalworldSaveParser.exe

      - name: Upload Windows artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PalworldHelper-win-x64
          path: publish/**
          if-no-files-found: error
