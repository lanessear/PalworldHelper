name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PalworldHelper.sln

      - name: Build
        shell: pwsh
        run: |
          dotnet build PalworldHelper.sln --configuration Release --no-restore *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed. Compiler errors:"
            Select-String -Path build.log -Pattern ': error ' | ForEach-Object { $_.Line }
            exit $LASTEXITCODE
          }

      - name: Test
        run: dotnet test PalworldHelper.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: |
            build.log
            TestResults
          if-no-files-found: ignore
