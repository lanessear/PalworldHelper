name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained application
        run: >-
          dotnet publish src/PalworldHelper.App/PalworldHelper.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/windows-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/PalworldHelper-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: PalworldHelper-windows-x64
          path: artifacts/PalworldHelper-windows-x64.zip

      - name: Attach archive to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/PalworldHelper-windows-x64.zip
          generate_release_notes: true
